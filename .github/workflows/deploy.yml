name: CI - Build & Deploy to Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - VMS-EUREKA-SERVER
          - VMS-API-GATEWAY
          - VMS-AUTH
          - VMS-VENDOR
          - VMS-DOCUMENT
          - VMS-ORDERS
          - VMS-PAYMENTS
          - VMS-DASHBOARD
          - VMS-PERFORMANCE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          mvn clean package -DskipTests

  trigger-render-deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Eureka
        run: curl -s -X POST "${{ secrets.RENDER_DEPLOY_EUREKA }}"
      - name: Deploy Gateway
        run: curl -s -X POST "${{ secrets.RENDER_DEPLOY_GATEWAY }}"
      - name: Deploy Auth
        run: curl -s -X POST "${{ secrets.RENDER_DEPLOY_AUTH }}"
      - name: Deploy Vendor
        run: curl -s -X POST "${{ secrets.RENDER_DEPLOY_VENDOR }}"
      - name: Deploy Orders
        run: curl -s -X POST "${{ secrets.RENDER_DEPLOY_ORDERS }}"
      - name: Deploy Payments
        run: curl -s -X POST "${{ secrets.RENDER_DEPLOY_PAYMENTS }}"
      - name: Deploy Document
        run: curl -s -X POST "${{ secrets.RENDER_DEPLOY_DOCUMENT }}"
      - name: Deploy Dashboard
        run: curl -s -X POST "${{ secrets.RENDER_DEPLOY_DASHBOARD }}"
      - name: Deploy Performance
        run: curl -s -X POST "${{ secrets.RENDER_DEPLOY_PERFORMANCE }}"
      - name: Deploy Frontend
        run: curl -s -X POST "${{ secrets.RENDER_DEPLOY_FRONTEND }}"
