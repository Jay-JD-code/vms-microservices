name: Build & Push Docker Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_USER: ${{ secrets.DOCKER_USER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - dir: VMS-EUREKA-SERVER
            name: vms-eureka-server
          - dir: VMS-API-GATEWAY
            name: vms-api-gateway
          - dir: VMS-AUTH
            name: vms-auth
          - dir: VMS-VENDOR
            name: vms-vendor
          - dir: VMS-DOCUMENT
            name: vms-document
          - dir: VMS-ORDERS
            name: vms-orders
          - dir: VMS-PAYMENTS
            name: vms-payments
          - dir: VMS-DASHBOARD
            name: vms-dashboard
          - dir: VMS-PERFORMANCE
            name: vms-performance
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build & Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.dir }}
          push: true
          tags: ${{ secrets.DOCKER_USER }}/${{ matrix.service.name }}:latest
