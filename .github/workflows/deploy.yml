name: Deploy VMS Microservices

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  EUREKA_IP: ${{ secrets.EUREKA_IP }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - VMS-EUREKA-SERVER
          - VMS-API-GATEWAY
          - VMS-AUTH
          - VMS-VENDOR
          - VMS-DOCUMENT
          - VMS-ORDERS
          - VMS-PAYMENTS
          - VMS-DASHBOARD
          - VMS-PERFORMANCE
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          SERVICE_LOWER=$(echo "${{ matrix.service }}" | tr '[:upper:]' '[:lower:]' | sed 's/vms-//')
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/vms-$SERVICE_LOWER:latest ./${{ matrix.service }}
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/vms-$SERVICE_LOWER:latest

  deploy-instance1:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Instance 1 (Gateway + Eureka)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.INSTANCE1_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/vms
            curl -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.instance1.yml
            docker-compose pull
            docker-compose up -d
            docker image prune -f

  deploy-instance2:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Instance 2 (Auth + Vendor + Dashboard)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.INSTANCE2_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/vms
            curl -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.instance2.yml
            docker-compose pull
            docker-compose up -d
            docker image prune -f

  deploy-instance3:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Instance 3 (Orders + Payments + Document + Performance)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.INSTANCE3_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/vms
            curl -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.instance3.yml
            docker-compose pull
            docker-compose up -d
            docker image prune -f

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./frontend-react
