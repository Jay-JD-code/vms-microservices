services:
  # ─────────────────────────────────────────
  # Instance 1: Gateway + Eureka
  # ─────────────────────────────────────────

  - type: web
    name: vms-eureka
    runtime: docker
    rootDir: VMS-EUREKA-SERVER
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8761"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: EUREKA_INSTANCE_HOSTNAME
        value: vms-eureka.onrender.com
      - key: EUREKA_CLIENT_REGISTER_WITH_EUREKA
        value: "false"
      - key: EUREKA_CLIENT_FETCH_REGISTRY
        value: "false"

  - type: web
    name: vms-gateway
    runtime: docker
    rootDir: VMS-API-GATEWAY
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        value: http://vms-eureka.onrender.com:8761/eureka
      - key: AUTH_SERVICE_URL
        value: http://vms-auth.onrender.com:8081
      - key: VENDOR_SERVICE_URL
        value: http://vms-vendor.onrender.com:8082
      - key: ORDERS_SERVICE_URL
        value: http://vms-orders.onrender.com:8084
      - key: PAYMENTS_SERVICE_URL
        value: http://vms-payments.onrender.com:8085
      - key: DOCUMENT_SERVICE_URL
        value: http://vms-document.onrender.com:8083

  # ─────────────────────────────────────────
  # Instance 2: Auth + Vendor + Dashboard
  # ─────────────────────────────────────────

  - type: web
    name: vms-auth
    runtime: docker
    rootDir: VMS-AUTH
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8081"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        value: http://vms-eureka.onrender.com:8761/eureka
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: VENDOR_SERVICE_URL
        value: http://vms-vendor.onrender.com:8082

  - type: web
    name: vms-vendor
    runtime: docker
    rootDir: VMS-VENDOR
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8082"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        value: http://vms-eureka.onrender.com:8761/eureka
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: AUTH_SERVICE_URL
        value: http://vms-auth.onrender.com:8081

  - type: web
    name: vms-dashboard
    runtime: docker
    rootDir: VMS-DASHBOARD
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8087"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        value: http://vms-eureka.onrender.com:8761/eureka

  # ─────────────────────────────────────────
  # Instance 3: Orders + Payments + Document + Performance
  # ─────────────────────────────────────────

  - type: web
    name: vms-orders
    runtime: docker
    rootDir: VMS-ORDERS
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8084"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        value: http://vms-eureka.onrender.com:8761/eureka
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  - type: web
    name: vms-payments
    runtime: docker
    rootDir: VMS-PAYMENTS
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8085"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        value: http://vms-eureka.onrender.com:8761/eureka
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  - type: web
    name: vms-document
    runtime: docker
    rootDir: VMS-DOCUMENT
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8083"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        value: http://vms-eureka.onrender.com:8761/eureka
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-southeast-1

  - type: web
    name: vms-performance
    runtime: docker
    rootDir: VMS-PERFORMANCE
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8088"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        value: http://vms-eureka.onrender.com:8761/eureka

  # ─────────────────────────────────────────
  # Frontend: React Static Site
  # ─────────────────────────────────────────

  - type: web
    name: vms-frontend
    runtime: static
    rootDir: frontend-react
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vms-gateway.onrender.com

  # ─────────────────────────────────────────
  # Keep-Alive Cron (prevents spin-down)
  # ─────────────────────────────────────────

  - type: cron
    name: vms-keep-alive
    runtime: docker
    schedule: "*/10 * * * *"
    dockerCommand: >
      sh -c "
        curl -s https://vms-gateway.onrender.com/actuator/health &&
        curl -s https://vms-auth.onrender.com/actuator/health &&
        curl -s https://vms-vendor.onrender.com/actuator/health &&
        curl -s https://vms-orders.onrender.com/actuator/health &&
        curl -s https://vms-payments.onrender.com/actuator/health &&
        curl -s https://vms-document.onrender.com/actuator/health
      "
